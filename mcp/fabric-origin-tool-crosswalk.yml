provider: Fabric Origin
providerId: fabric-origin
description: 'Crosswalk between Fabric Origin''s MCP tool surface and its published REST operations. The headline finding
  is a PRODUCT-LINE GAP rather than a per-operation mismatch: the two MCP servers Fabric publishes serve Origin Studio and
  Origin Insights, while all 121 published REST operations belong to Origin Nexus. An agent can call Nexus over REST or call
  Studio/Insights over MCP, but no single surface spans the Origin family.'
