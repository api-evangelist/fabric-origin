    operations: 121
    host: https://api.origin.fabricdata.com
    gated: contract public; calls require an Ocp-Apim-Subscription-Key
  graphql:
    endpoint: null
    note: Fabric publishes no GraphQL surface.
  mcp:
  - url: https://mcp-api.studio.fabricdata.com
    product: Origin Studio
    gated: true
    note: tools/list 401 — tool names and inputSchemas not enumerable anonymously
  - url: https://insights.fabric-mcp.link
    product: Origin Insights
    gated: true
    note: tools/list 401 — tool NAMES published in the docs, inputSchemas not
crosswalk:
- tool: titles
  action: find_title
  category: title resolution
  rest:
  - SearchEntertainmentSearch_Get
  binding: semantic
  confidence: low
  note: 'Both resolve a title from a keyword, but against DIFFERENT data cores: the Insights MCP resolves a uid inside the
    Origin Insights market-intelligence catalog, while SearchEntertainmentSearch_Get searches the Origin Nexus metadata catalog.
    Ids are not documented as interchangeable. Mapped by semantics only; the live MCP inputSchema is auth-gated.'
- tool: titles
  action: get_title_external_ids
  category: identifier crosswalk
  rest:
  - GetEntertainmentMatchCandidatesEntertainmentGetEntertainmentMatchCandidates_Get
  binding: semantic
  confidence: low
  note: Both surface external-identifier crosswalks (TMDb/IMDb/TVDB/EIDR on the Insights side, Nexus match candidates on the
    REST side). Not the same operation; recorded so the overlap is not silently dropped.
