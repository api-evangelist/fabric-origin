    url: https://knowledgebase.fabricdata.com/origin/apis-all/
  - type: Knowledge Base
    url: https://knowledgebase.fabricdata.com/origin
- aid: fabric-origin:celebrity-api
  name: Fabric Origin Celebrity API
  description: >-
    The Celebrity API serves metadata about celebrities, including actors, directors, and other entertainment
    industry figures, with cross references to titles served by the Entertainment API.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://knowledgebase.fabricdata.com/origin/apis-all/
  baseURL: https://ee.iva-api.com/api/
  tags:
  - Celebrities
  - People
  - Metadata
  properties:
  - type: Documentation
    url: https://knowledgebase.fabricdata.com/origin/apis-all/
- aid: fabric-origin:video-api
  name: Fabric Origin Video API
  description: >-
    The Video API generates playable links for trailers and other video assets using video identifiers
    returned from the Entertainment API, allowing customers to embed Fabric Origin video content into
    their content discovery experiences.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://knowledgebase.fabricdata.com/origin/apis-all/
  baseURL: https://ee.iva-api.com/api/
  tags:
  - Video
  - Trailers
  - Streaming
  properties:
  - type: Documentation
    url: https://knowledgebase.fabricdata.com/origin/apis-all/
- aid: fabric-origin:image-api
  name: Fabric Origin Image API
  description: >-
    The Image API provides access to images hosted on Fabric Origin's servers, including posters, stills,
    and promotional artwork referenced from the Entertainment and Celebrity APIs. Customers are encouraged
    to host and serve images from their own infrastructure for production use.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://knowledgebase.fabricdata.com/origin/apis-all/
  baseURL: https://ee.iva-api.com/api/
  tags:
  - Images
  - Posters
  - Artwork
  properties:
  - type: Documentation
    url: https://knowledgebase.fabricdata.com/origin/apis-all/
- aid: fabric-origin:common-data-api
  name: Fabric Origin Common Data API
  description: >-
    The Common Data API exposes reference data used across the Fabric Origin product family, including
    country codes, image type lookups, and video type lookups required when working with the Entertainment,
    Celebrity, Video, and Image APIs.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://knowledgebase.fabricdata.com/origin/apis-all/
