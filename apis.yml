aid: fabric-origin
name: Fabric Origin
description: 'Fabric Origin is the entertainment metadata and market-intelligence arm of Fabric, the media
  software company formed from Xytech and IVA. Origin spans three products: Nexus, a family of 14 REST
  APIs serving movie, television, game and celebrity metadata plus images, trailers, TV listings, showtimes
  and licensed third-party ratings from Metacritic, Rotten Tomatoes, Common Sense Media and Katch; Studio,
  a JSON:API 1.1 metadata management platform with an SNS event surface; and Insights, streaming market
  intelligence across 1,000+ platforms and 249 countries. Fabric publishes machine-readable OpenAPI 3.1.1
  for the whole Nexus surface, an llms.txt index at the company root, and two OAuth-governed hosted MCP
  servers — Origin Studio and Origin Insights — making it one of the more deliberately agent-ready entertainment-data
  providers in the catalog.'
