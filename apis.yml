apis:
- aid: fabric-origin:entertainment-api
  name: Fabric Origin Entertainment API
  description: >-
    The Entertainment API ingests and serves metadata for movies, television shows, and games, including
    identifiers used to retrieve associated videos and images from sibling APIs. Responses are available
    in JSON, XML, CSV, and HTML formats via Accept headers or the format query parameter.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://knowledgebase.fabricdata.com/origin/apis-all/
  baseURL: https://ee.iva-api.com/api/
  tags:
