pricing_model: contact-sales
description: >-
  Fabric publishes a pricing PAGE but no priced plans. https://www.fabricdata.com/pricing-models
  states the commercial model in prose and routes every buyer to the account team: pricing "reflects
  the product footprint, deployment model, and consumption pattern your teams actually use". No
  tier, no unit price, no quota, no overage rate is published for any Origin product. The three
  named tiers in the previous version of this file (Free / Professional / Enterprise, with request
  quotas and per-minute limits) were 2026-05-04 bulk-sweep scaffold defaults and matched nothing
  Fabric publishes; they have been removed.
plans: []
commercial_model:
  basis: deployment scope
  statement: >-
    "Agent and MCP access is licensed by deployment scope — not per seat and not per agent — so
    scaling your agent workloads doesn't scale your bill."
  agents_included: >-
    "Software agents and API workloads are governed by the same commercial access terms as human
    users."
  docs_posture: >-
    "Technical documentation is public and never sales-gated for teams, developers, or machine
    readers." Confirmed by probe — the full knowledge base, llms.txt indexes and the embedded
    OpenAPI documents are all served anonymously.
  source: https://www.fabricdata.com/pricing-models
access_paths:
- name: Free Trial
  price: null
  duration: 30 days
  cost: free
  request: https://www.fabricdata.com/contact-us
  note: Severely rate limited — 5 requests/second, 1,000 requests/month. Not self-serve; a form request.
  source: https://knowledgebase.fabricdata.com/origin/getting-started
- name: Paid subscription
  price: null
  process: Contact sales for a demo and a scoped quote
  request: https://www.fabricdata.com/contact-us
  source: https://knowledgebase.fabricdata.com/origin/getting-started
- name: AWS Marketplace
  price: null
  url: https://aws.amazon.com/marketplace/seller-profile?id=seller-3qam644v4tqge
  note: Fabric maintains an AWS Marketplace seller profile; listing terms are not mirrored here.
solution_bundles:
  note: >-
    Fabric packages the Origin Nexus APIs into named SOLUTIONS rather than priced tiers. Each API's
    documentation states which solutions include it. The bundles are published; their prices are not.
  bundles:
  - All Access
  - Entertainment Discovery
  - Entertainment News
  - Theatrical Movies
  - TV Grid Online
  - Movie Showtimes and Ticketing
  - Rev Captions And Translations
  - Metacritic Ratings and Reviews
  - Common Sense Media Ratings and Reviews
  - Rabbit Recommendations
  source: https://knowledgebase.fabricdata.com/origin/apis-all
