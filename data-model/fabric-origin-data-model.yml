description: 'Entity graph derived from the components.schemas and $ref links of the 14 Origin Nexus OpenAPI documents Fabric
  publishes. The catalog is title-centric: an entertainment record (Movie, Show, Season, Episode, Game) is the hub, and images,
  videos, availabilities, ratings, reviews and celebrity credits hang off it by identifier. Cross-API navigation is by identifier,
  not by hyperlink — an Entertainment response carries a VideoId that the Video API resolves, and an image identifier that
  the Image API resolves.'
