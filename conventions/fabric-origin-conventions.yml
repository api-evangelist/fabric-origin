  errors: errors/fabric-origin-problem-types.yml
  lifecycle: lifecycle/fabric-origin-lifecycle.yml
  authentication: authentication/fabric-origin-authentication.yml
  rate_limits: rate-limits/fabric-origin-rate-limits.yml
  changelog: changelog/fabric-origin-changelog.yml
  conformance: conformance/fabric-origin-conformance.yml
