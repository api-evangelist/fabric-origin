        name: Providers
        in: query
        description: List of availability providers.  See /Common/GetCommonEnumerators endpoint for complete list.
        required: false
      - schema:
          type: string
          format: date-time
        name: StartDateStart
        in: query
        description: Start date for availability StartDate filter.
        required: false
      - schema:
          type: string
          format: date-time
        name: StartDateEnd
        in: query
        description: End date for availability StartDate filter.
        required: false
      - schema:
          type: array
          items:
            type: string
            enum:
            - NOT_SET
            - Scheduled
            - Ticket
            - Physical
            - OnDemand
        style: form
        explode: true
        name: DeliveryMethods
        in: query
        description: List of availability delivery methods. See /Common/GetCommonEnumerators endpoint for complete list.
        required: false
