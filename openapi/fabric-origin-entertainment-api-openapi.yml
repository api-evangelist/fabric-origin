        description: List of themes (movie and show).
        required: false
      - schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        name: Tags
        in: query
        description: List of tags (movie and show).
        required: false
      - schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        name: Certifications
        in: query
        description: List of certifications for movie and show.
        required: false
      - schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        name: PersonNames
